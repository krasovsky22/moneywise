pre-commit:
  parallel: true
  commands:
    python-lint:
      glob: "apps/api/**/*.py"
      root: "apps/api"
      run: uv run ruff check {staged_files} && uv run ruff format {staged_files}
    js-lint:
      glob: "apps/web/**/*.{ts,tsx}"
      run: pnpm --filter web lint

commit-msg:
  commands:
    conventional:
      run: |
        if ! head -1 {1} | grep -qE '^(feat|fix|docs|style|refactor|test|chore|build|ci|perf|revert)(\(.+\))?: .{1,100}$'; then
          echo "ERROR: Commit message must follow Conventional Commits:"
          echo "  <type>(<scope>): <description>"
          echo "  Types: feat fix docs style refactor test chore build ci perf revert"
          echo "  Example: feat(auth): add JWT login endpoint"
          exit 1
        fi
