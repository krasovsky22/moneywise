[project]
name = "moneywise-api"
version = "0.1.0"
description = "MoneyWise API backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "pydantic[email]>=2.10",
    "pydantic-settings>=2.7",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "python-jose[cryptography]>=3.3",
    "passlib[bcrypt]>=1.7",
    "httpx>=0.28",
    "structlog>=24.4",
    "bcrypt<4.0",
    "python-multipart>=0.0.9",
    "aiofiles>=24.0",
    "typer>=0.12",
    "pdfplumber>=0.11",
    "openai>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "ruff>=0.9",
    "mypy>=1.14",
    "types-passlib",
    "types-python-jose",
    "types-aiofiles",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

# Ruff: replaces black, isort, flake8
[tool.ruff]
target-version = "py312"
line-length = 88
exclude = ["alembic/versions/"]
force-exclude = true

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "W"]
# I = isort, UP = pyupgrade, B = bugbear, SIM = simplify
# B008: FastAPI uses Depends() in default args intentionally
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"src/app/modules/statements/pipeline.py" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

# mypy: strict mode
[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["alembic/"]

[[tool.mypy.overrides]]
module = ["jose.*", "passlib.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["pdfplumber.*", "openai.*"]
ignore_missing_imports = true

# pytest
[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
pythonpath = ["src"]

# coverage
[tool.coverage.run]
source = ["app"]
omit = ["*/tests/*", "*/alembic/*"]

[tool.coverage.report]
skip_empty = true
